[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "greenai"
version = "0.1.0"
description = "Lightweight carbon footprint tracking for ML workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GreenAI Contributors" }]
keywords = ["machine-learning", "carbon", "energy", "green-ai", "sustainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
codecarbon = ["codecarbon>=2.3"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/samibahig/greenai"
Repository = "https://github.com/samibahig/greenai"
Issues = "https://github.com/samibahig/greenai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["greenai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
